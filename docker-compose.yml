version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-skribbl-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/devops_skribbl
      - NODE_ENV=development
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
    command: npm run dev

  db:
    image: postgres:15-alpine
    container_name: devops-skribbl-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=devops_skribbl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
