<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Skribbl</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="app">
        <h1>DevOps Skribbl</h1>
        <div id="landing-view" class="container flex items-center justify-center landing-wrapper">
            <div class="card landing-card">
                <h2 class="text-center mb-md">DevOps Skribbl</h2>
                
                <div class="mb-md">
                    <label for="nickname" class="block mb-sm font-bold">Nickname</label>
                    <input type="text" id="nickname" class="input" placeholder="Enter your name">
                </div>

                <div class="flex flex-col gap-md">
                    <button id="btn-create-room" class="btn btn-primary w-full">Create New Room</button>
                    
                    <div class="flex items-center gap-sm">
                        <div class="divider-line"></div>
                        <span class="divider-text">OR</span>
                        <div class="divider-line"></div>
                    </div>

                    <div class="flex gap-sm">
                        <input type="text" id="room-code" class="input" placeholder="Room Code">
                        <button id="btn-join-room" class="btn btn-secondary">Join</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="lobby-view" class="container hidden mt-lg">
            <div class="lobby-grid">
                <!-- Room Info & Settings -->
                <div class="card">
                    <h2 class="mb-md">Lobby</h2>
                    <div class="mb-lg p-md room-code-box">
                        <span class="block text-sm mb-sm text-muted">ROOM CODE</span>
                        <strong id="lobby-room-code" class="text-2xl tracking-wide"></strong>
                    </div>

                    <div id="host-controls" class="hidden">
                        <h3 class="text-lg mb-sm">Game Settings</h3>
                        <!-- Placeholder for settings if needed later -->
                        <p class="text-sm mb-md text-muted">Default: 3 Rounds, 80s Draw Time</p>
                        <button id="btn-start-game" class="btn btn-primary w-full">Start Game</button>
                    </div>
                    <div id="waiting-message" class="text-center text-muted">
                        Waiting for host to start...
                    </div>
                </div>

                <!-- Player List -->
                <div class="card">
                    <h3 class="mb-md">Players</h3>
                    <ul id="lobby-player-list" class="flex flex-col gap-sm">
                        <!-- Players will be injected here -->
                    </ul>
                </div>
            </div>
        </div>
                <div id="game-view" class="container hidden h-full flex flex-col">
            <!-- Game Header -->
            <header class="game-header card flex justify-between items-center mb-md p-sm">
                <div class="flex gap-lg">
                    <div class="text-center">
                        <span class="block text-sm text-muted">ROUND</span>
                        <strong id="round-number" class="text-xl">1</strong>
                    </div>
                    <div class="text-center">
                        <span class="block text-sm text-muted">TIME</span>
                        <strong id="timer" class="text-xl">80</strong>
                    </div>
                </div>
                <div id="word-display" class="text-2xl font-bold tracking-wide">WAITING...</div>
                <div class="w-20"></div> <!-- Spacer for balance -->
            </header>

            <!-- Game Grid -->
            <div class="game-grid">
                <!-- Toolbar (Left) -->
                <aside class="tools-panel card flex flex-col gap-sm items-center">
                    <div id="toolbar" class="flex flex-col gap-sm w-full">
                        <div class="text-sm text-muted text-center mb-sm">COLORS</div>
                        <div class="grid grid-cols-2 gap-sm">
                            <button class="color-btn bg-black" data-color="black" title="Black"></button>
                            <button class="color-btn bg-red" data-color="red" title="Red"></button>
                            <button class="color-btn bg-blue" data-color="blue" title="Blue"></button>
                            <button class="color-btn bg-green" data-color="green" title="Green"></button>
                        </div>
                        
                        <div class="divider-line my-sm"></div>
                        
                        <div class="text-sm text-muted text-center mb-sm">SIZE</div>
                        <div class="flex justify-between">
                            <button class="size-btn btn-icon" data-size="2">S</button>
                            <button class="size-btn btn-icon" data-size="5">M</button>
                            <button class="size-btn btn-icon" data-size="10">L</button>
                        </div>

                        <div class="divider-line my-sm"></div>

                        <button id="btn-clear" class="btn btn-danger w-full text-sm">Clear</button>
                    </div>
                </aside>

                <!-- Canvas (Center) -->
                <main class="canvas-area card flex items-center justify-center p-0 overflow-hidden">
                    <canvas id="game-canvas" width="800" height="600" class="game-canvas"></canvas>
                </main>

                <!-- Right Panel -->
                <aside class="right-panel flex flex-col gap-md h-full overflow-hidden">
                    <!-- Leaderboard -->
                    <div class="card p-sm overflow-y-auto h-200">
                        <h3 class="text-sm text-muted mb-sm">LEADERBOARD</h3>
                        <ul id="game-player-list" class="flex flex-col gap-xs"></ul>
                    </div>

                    <!-- Chat -->
                    <div class="card flex flex-col p-0 overflow-hidden flex-grow">
                        <div id="chat-messages" class="chat-messages flex-grow p-md overflow-y-auto"></div>
                        <div class="p-sm border-t">
                            <input type="text" id="chat-input" class="input" placeholder="Type guess here...">
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
        <div id="word-selection-overlay" class="hidden fixed inset-0 flex items-center justify-center bg-overlay z-50">
        <div class="card text-center">
            <h3 class="mb-md">Choose a Word</h3>
            <div id="word-options" class="flex gap-md">
                <!-- Buttons injected here -->
            </div>
        </div>
    </div>
    <div id="game-over-overlay" class="hidden fixed inset-0 flex items-center justify-center bg-overlay z-50">
        <div class="card text-center min-w-300">
            <h2 class="mb-md">Game Over!</h2>
            <div id="final-scores" class="flex flex-col gap-sm mb-md">
                <!-- Scores injected here -->
            </div>
            <button id="btn-return-lobby" class="btn btn-primary w-full">Return to Lobby</button>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
