<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Skribbl - SRE & DevOps Drawing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 DevOps Skribbl</h1>
            <p class="subtitle">Draw and guess SRE & DevOps terms!</p>
        </header>

        <div id="menu-screen" class="screen active">
            <div class="menu-content">
                <h2>Choose Difficulty</h2>
                <div class="difficulty-buttons">
                    <button class="btn btn-easy" onclick="startGame('easy')">Easy</button>
                    <button class="btn btn-medium" onclick="startGame('medium')">Medium</button>
                    <button class="btn btn-hard" onclick="startGame('hard')">Hard</button>
                </div>
                <div class="info-box">
                    <h3>How to Play</h3>
                    <ul>
                        <li>Select a difficulty level</li>
                        <li>Draw the word shown at the top</li>
                        <li>Click "Next Word" to get a new term</li>
                        <li>Challenge your team to guess!</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="word-container">
                    <h2 id="current-word">Word will appear here</h2>
                    <span id="difficulty-badge" class="badge">Easy</span>
                </div>
                <div class="game-controls">
                    <button class="btn btn-primary" onclick="nextWord()">Next Word</button>
                    <button class="btn btn-secondary" onclick="toggleWord()">Hide/Show Word</button>
                    <button class="btn btn-secondary" onclick="backToMenu()">Back to Menu</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="drawing-canvas" width="800" height="600"></canvas>
            </div>

            <div class="drawing-tools">
                <div class="color-palette">
                    <button class="color-btn" data-color="#000000" style="background: #000000"></button>
                    <button class="color-btn" data-color="#FF0000" style="background: #FF0000"></button>
                    <button class="color-btn" data-color="#00FF00" style="background: #00FF00"></button>
                    <button class="color-btn" data-color="#0000FF" style="background: #0000FF"></button>
                    <button class="color-btn" data-color="#FFFF00" style="background: #FFFF00"></button>
                    <button class="color-btn" data-color="#FF00FF" style="background: #FF00FF"></button>
                    <button class="color-btn" data-color="#00FFFF" style="background: #00FFFF"></button>
                    <button class="color-btn" data-color="#FFFFFF" style="background: #FFFFFF; border: 1px solid #ccc"></button>
                </div>
                <div class="tool-controls">
                    <label for="brush-size">Brush Size:</label>
                    <input type="range" id="brush-size" min="1" max="20" value="5">
                    <button class="btn btn-danger" onclick="clearCanvas()">Clear Canvas</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
